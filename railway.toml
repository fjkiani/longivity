[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn longivity.app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/v1/longevity/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "backend"

[[services]]
name = "frontend"
rootDirectory = "web"
