name: Simulate Render Build Environment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  simulate-render-python:
    # Use Debian Bullseye (same as Render's Python service)
    runs-on: ubuntu-22.04
    container:
      image: python:3.11-slim-bullseye
    steps:
      - uses: actions/checkout@v4
      
      - name: Show environment
        run: |
          python --version
          pip --version
          uname -a
          cat /etc/os-release
      
      - name: Test: pip install fastapi (should be fast)
        run: |
          pip install fastapi uvicorn
          echo "fastapi install: SUCCESS"
      
      - name: Test: pip install -e . (full app)
        run: |
          pip install -e .
          echo "pip install -e .: SUCCESS"
      
      - name: Test: import app
        run: |
          python -c "import longivity.app; print('Import OK')"

  simulate-render-node:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: web
        run: |
          npm install
          npm run build
          echo "Frontend build: SUCCESS"
