name: Test Render Build Commands

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test backend build command
        run: |
          pip install -r requirements.txt
          echo "pip install -r requirements.txt: SUCCESS"
      - name: Test backend start command (import check)
        run: |
          PYTHONPATH=/home/runner/work/longivity/longivity/src:/home/runner/work/longivity/longivity python -c "
          import longivity.app
          print('Import longivity.app: SUCCESS')
          "

  test-frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test frontend build command
        working-directory: web
        run: |
          npm install
          npm run build
          echo "npm run build: SUCCESS"
