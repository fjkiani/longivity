[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longivity"
version = "0.1.0"
description = "CrisPRO longevity assessment (PhenoAge + hallmarks + optional genetics/DNA repair + PRS) (RUO)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "CrisPRO" }]
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.0.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
]

[project.urls]
Repository = "https://github.com/fjkiani/longivity"

[tool.setuptools]
# src/ contains the longivity package; repo root contains the agents/ package
package-dir = { "" = "src", "longivity.agents" = "agents" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.setuptools.package-data]
longivity = [
  "resources/longevity/*.json",
  "resources/longevity/*.md",
]

[tool.pytest.ini_options]
# Allow agents/ to be importable during tests by adding repo root to sys.path
pythonpath = ["."]
