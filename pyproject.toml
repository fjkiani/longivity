[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longivity"
version = "0.3.0"
description = "Longivity — End-to-end longevity patient platform (PhenoAge + hallmarks + patient management + PDF lab import) (RUO)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "CrisPRO" }]
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.0.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  # Patient platform
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "pdfplumber>=0.11.0",
  "python-multipart>=0.0.9",
  "aiofiles>=23.0.0",
  "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[project.urls]
Repository = "https://github.com/fjkiani/longivity"

[tool.setuptools]
# src/ contains the longivity package; repo root contains the agents/ package
package-dir = { "" = "src", "longivity.agents" = "agents" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.setuptools.package-data]
longivity = [
  "resources/longevity/*.json",
  "resources/longevity/*.md",
]

[tool.pytest.ini_options]
# Allow agents/ to be importable during tests by adding repo root to sys.path
pythonpath = ["."]
