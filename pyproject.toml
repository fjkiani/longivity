[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longivity"
version = "0.4.0"
description = "Longivity — End-to-end longevity patient platform (PhenoAge + hallmarks + patient management + PDF lab import + agent test ordering) (RUO)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "CrisPRO" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.urls]
Repository = "https://github.com/fjkiani/longivity"

[tool.setuptools]
# src/ contains the longivity package; repo root contains the agents/ package
package-dir = { "" = "src", "longivity.agents" = "agents" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
longivity = [
  "resources/longevity/*.json",
  "resources/longevity/*.md",
  "resources/*.json",
]

[tool.pytest.ini_options]
# Allow agents/ to be importable during tests by adding repo root to sys.path
pythonpath = ["."]
