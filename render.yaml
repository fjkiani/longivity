databases:
  - name: longivity-db
    databaseName: longivity
    user: longivity
    plan: free

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: longivity-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/longevity/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: longivity-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://longivity-web.onrender.com

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  - type: web
    name: longivity-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    plan: free
    dockerContext: ./web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://longivity-backend.onrender.com
